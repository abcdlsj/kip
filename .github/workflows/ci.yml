name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck / test / view
    # Fresh instabox CI box per job (Ubuntu 24.04 + GitHub Actions runner).
    # The box is deleted when the job ends; see docs in the instabox dashboard.
    runs-on: instabox-medium
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # bun.lock is lockfileVersion 2, which needs bun >= 1.4; 1.3 ignores it.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build:view

  windows:
    name: windows package
    # Electrobun only builds for the host OS, so the .exe has to be produced on
    # Windows; the instabox box above is Linux and cannot cross-compile it.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-windows-${{ hashFiles('bun.lock') }}
          restore-keys: bun-windows-

      - run: bun install --frozen-lockfile
      - run: bun run icons
      - run: bun run build:view
      # The workspace CLI, not bunx: build hooks and the extractor/launcher
      # binaries must resolve inside this install, not a bunx cache.
      - run: bun run electrobun build --env=stable

      - uses: actions/upload-artifact@v7
        with:
          name: kip-windows-x64
          path: |
            artifacts/**
            build/stable-win-x64/**
          if-no-files-found: error
