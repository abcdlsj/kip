name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck / test / view
    # Fresh instabox CI box per job (Ubuntu 24.04 + GitHub Actions runner).
    # The box is deleted when the job ends; see docs in the instabox dashboard.
    runs-on: instabox-medium
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # bun.lock is lockfileVersion 2, which needs bun >= 1.4; 1.3 ignores it.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build:view
