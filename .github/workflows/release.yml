name: Release

# Push a tag like v0.1.0 to publish a release. The tag must match the version in
# electrobun.config.ts and package.json; the job fails early when it does not.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}
  BUN_VERSION: 1.4.4

jobs:
  prepare:
    name: check version and open draft
    runs-on: instabox-medium
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Fail unless the tag matches the app version
        run: |
          set -euo pipefail
          tag="${TAG#v}"
          cfg=$(bun -e 'import c from "./electrobun.config.ts"; console.log(c.app.version)')
          pkg=$(bun -e 'console.log((await Bun.file("package.json").json()).version)')
          echo "tag=$tag electrobun.config.ts=$cfg package.json=$pkg"
          if [ "$tag" != "$cfg" ] || [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match app version (config $cfg, package $pkg)"
            exit 1
          fi

      # A draft keeps half-uploaded assets invisible until every build is done.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "Kip $TAG" --generate-notes

  # macos-15 (arm64) is the scarce runner: when GitHub cannot acquire it, the job
  # fails with "not acquired by Runner of type hosted" and the release is left in
  # draft, because cask and publish depend on this job. Retry the failed job with
  # `gh run rerun <run-id> --failed`; cask and publish then run on their own.
  macos:
    name: macos ${{ matrix.arch }} dmg
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15 # M1, arm64
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-macos-${{ matrix.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-macos-${{ matrix.arch }}-

      - run: bun install --frozen-lockfile
      - run: bun run icons
      - run: bun run build:view
      # The workspace CLI, not bunx: build hooks and the extractor/launcher
      # binaries must resolve inside this install, not a bunx cache.
      - run: bun run electrobun build --env=stable

      - name: Package macOS .app.zip for auto-update
        run: |
          set -euo pipefail
          app="build/stable-macos-${{ matrix.arch }}/Kip.app"
          if [ ! -d "$app" ]; then
            app=$(find build -maxdepth 2 -name 'Kip.app' -type d | head -n 1)
          fi
          [ -d "$app" ] || { echo "::error::Kip.app not found in build/"; ls -la build/; exit 1; }
          /usr/bin/codesign --verify --deep --strict "$app"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$app" "artifacts/stable-macos-${{ matrix.arch }}-Kip.app.zip"

      - name: Attach macOS release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" artifacts/*.dmg artifacts/*-Kip.app.zip --clobber

      - uses: actions/upload-artifact@v7
        with:
          name: kip-macos-${{ matrix.arch }}
          path: artifacts/**
          if-no-files-found: error

  windows:
    name: windows x64 installer
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-windows-${{ hashFiles('bun.lock') }}
          restore-keys: bun-windows-

      - run: bun install --frozen-lockfile
      - run: bun run icons
      - run: bun run build:view
      # The workspace CLI, not bunx: build hooks and the extractor/launcher
      # binaries must resolve inside this install, not a bunx cache.
      - run: bun run electrobun build --env=stable

      - name: Attach the installer
        # bash, so the artifacts/*.zip glob expands; pwsh would pass it through literally
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # The bare tar.zst is what in-app updates on Windows download.
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/*-Kip-Setup.zip artifacts/*-Kip.tar.zst)
          [ ${#files[@]} -gt 0 ] || { echo "::error::no Windows assets produced"; exit 1; }
          gh release upload "$TAG" "${files[@]}" --clobber

      - uses: actions/upload-artifact@v7
        with:
          name: kip-windows-x64
          path: artifacts/**
          if-no-files-found: error

  linux:
    name: linux x64 package
    needs: prepare
    # Linux packaging is still experimental; a failure here must not block the
    # macOS and Windows release. Drop continue-on-error once it has shipped.
    continue-on-error: true
    runs-on: instabox-medium
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Electrobun's documented Linux prerequisites.
      - name: Install WebKitGTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-linux-${{ hashFiles('bun.lock') }}
          restore-keys: bun-linux-

      - run: bun install --frozen-lockfile
      - run: bun run icons
      - run: bun run build:view
      - run: bun run electrobun build --env=stable

      - name: Attach the update archive
        env:
          GH_TOKEN: ${{ github.token }}
        # In-app updates on Linux download the bare tar.zst, not an installer.
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/*-Kip.tar.zst)
          [ ${#files[@]} -gt 0 ] || { echo "::error::no Linux archive produced"; exit 1; }
          gh release upload "$TAG" "${files[@]}" --clobber

      - uses: actions/upload-artifact@v7
        with:
          name: kip-linux-x64
          path: artifacts/**
          if-no-files-found: error

  cask:
    name: homebrew cask
    needs: [macos]
    runs-on: instabox-medium
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: kip-macos-*
          path: dmgs
          merge-multiple: true

      # The dmg names come from electrobun's <env>-<os>-<arch> prefix; both
      # architectures must exist or the cask would pin a broken url.
      - name: Write kip.rb with the dmg checksums
        run: |
          set -euo pipefail
          version="${TAG#v}"
          arm="dmgs/stable-macos-arm64-Kip.dmg"
          intel="dmgs/stable-macos-x64-Kip.dmg"
          for f in "$arm" "$intel"; do
            [ -f "$f" ] || { echo "::error::missing $f"; ls -R dmgs; exit 1; }
          done
          arm_sha=$(shasum -a 256 "$arm" | cut -d' ' -f1)
          intel_sha=$(shasum -a 256 "$intel" | cut -d' ' -f1)
          cat > kip.rb <<EOF
          # typed: strict
          # frozen_string_literal: true

          cask "kip" do
            version "$version"

            on_arm do
              sha256 "$arm_sha"

              url "https://github.com/abcdlsj/kip/releases/download/v#{version}/stable-macos-arm64-Kip.dmg"
            end
            on_intel do
              sha256 "$intel_sha"

              url "https://github.com/abcdlsj/kip/releases/download/v#{version}/stable-macos-x64-Kip.dmg"
            end

            name "Kip"
            desc "Quiet, cross-platform desktop coding agent built with Electrobun and Pi"
            homepage "https://github.com/abcdlsj/kip"

            depends_on macos: :monterey

            app "Kip.app"

            zap trash: [
              "~/Library/Application Support/ai.kip.desktop",
              "~/Library/Caches/ai.kip.desktop",
              "~/Library/Preferences/ai.kip.desktop.plist",
            ]
          end
          EOF
          cat kip.rb
          command -v ruby >/dev/null && ruby -c kip.rb

      - name: Attach the cask
        env:
          GH_TOKEN: ${{ github.token }}
        # no checkout in this job, so gh has no repo to infer from
        run: gh release upload "$TAG" kip.rb --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    name: publish
    needs: [macos, windows, linux, cask]
    runs-on: instabox-medium
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: kip-macos-*
          path: release-assets
          merge-multiple: true

      - name: Generate and attach signed auto-update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          arm_zip="release-assets/stable-macos-arm64-Kip.app.zip"
          x64_zip="release-assets/stable-macos-x64-Kip.app.zip"
          for f in "$arm_zip" "$x64_zip"; do
            [ -f "$f" ] || { echo "::error::missing $f"; ls -la release-assets; exit 1; }
          done
          python3 scripts/generate-update-manifest.py \
            --app kip \
            --repo abcdlsj/kip \
            --tag "$TAG" \
            --version "${TAG#v}" \
            --bundle-id ai.kip.desktop \
            --bundle-name Kip.app \
            --min-os 12.0 \
            --out-dir update-manifest \
            --asset "darwin-aarch64=${arm_zip}" \
            --asset "darwin-x86_64=${x64_zip}"
          if [ -f update-manifest/latest.json ] && [ -f update-manifest/latest.json.sig ]; then
            gh release upload "$TAG" update-manifest/latest.json update-manifest/latest.json.sig --clobber
          fi

      - name: Drop the draft flag and list the assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"'
